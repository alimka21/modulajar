
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAKAR MODUL AJAR - AI Lesson Plan Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'], // UI Font
              serif: ['Cambria', 'Georgia', 'serif'], // Document Font
            }
          }
        }
      }
    </script>
    
    <!-- External Libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/vfs_fonts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- PDF.js for reading PDF files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- MathJax for Math Rendering -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: {
          fontCache: 'global'
        },
        startup: {
          typeset: false 
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Google Fonts for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      body { 
        font-family: 'Inter', system-ui, sans-serif; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8f9fa;
      }
      
      /* Dokumen Preview Font set to Cambria */
      .document-font { font-family: 'Cambria', Georgia, serif; }
      
      /* Custom Scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #dadce0; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bdc1c6; 
      }

      /* Markdown Styles for ResultPreview */
      .prose blockquote {
        border-left: 4px solid #facc15; 
        background-color: #fefce8; 
        padding: 0.5rem 1rem;
        margin: 0.5rem 0;
        border-radius: 0 0.5rem 0.5rem 0;
        font-style: italic;
        color: #854d0e; 
        font-size: 0.9em;
      }
      .prose strong {
        font-weight: 700;
        color: #1f1f1f;
      }

      /* =========================================
         PRINT CSS (REVISED)
         ========================================= */
      @media print {
        /* Sembunyikan elemen UI */
        nav, header, button, .no-print, .sidebar, .tabs-bar, .flex-none {
            display: none !important;
        }
        
        /* Reset Layout Container untuk membiarkan konten mengalir ke halaman berikutnya */
        body, #root, main, .h-screen, .overflow-hidden, .flex, .flex-col, .flex-1, .relative {
            display: block !important;
            height: auto !important;
            overflow: visible !important;
            position: static !important;
            width: 100% !important;
            background-color: white !important;
        }

        /* Styling khusus Konten Dokumen */
        #konten-dokumen {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            position: static !important;
            background-color: white !important;
            
            /* Pastikan font cetak benar */
            font-family: 'Cambria', Georgia, serif !important;
            font-size: 12pt !important;
            color: black !important;
            line-height: 1.5 !important;
        }

        /* Atur margin halaman kertas fisik */
        @page {
            size: A4 portrait;
            margin: 2.5cm; /* Margin fisik kertas */
        }
        
        /* Penanganan Page Break */
        .page-break {
            page-break-before: always !important;
            break-before: page;
        }
        
        /* Hindari pemotongan elemen di tengah */
        tr, td, th, li {
            page-break-inside: avoid;
        }
        
        /* Override background colors */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
      }
    </style>
